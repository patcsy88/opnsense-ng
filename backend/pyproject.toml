[project]
name = "opnsense-ng-backend"
version = "0.1.0"
description = "OPNsense Firewall Manager backend (FastAPI) - security boundary between the PWA and OPNsense"
requires-python = ">=3.15,<3.16"
# Exact pins per ADR-0003 (Phase 1 approved list). uvicorn is intentionally installed
# WITHOUT the [standard] extra (no Python 3.15 wheels for its extras yet).
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "itsdangerous==2.2.0",
    "segno==1.6.6",
    "slowapi==0.1.10",
    "structlog==26.1.0",
    "maxminddb==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "alembic.*"]
ignore_missing_imports = true
