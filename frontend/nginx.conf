# Static SPA server. /api is routed by Caddy, never proxied from here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # Hashed build assets: immutable.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Never cache the shell, the service worker or its helper scripts.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location = /sw-offline.js { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location = /offline.html { add_header Cache-Control "no-cache"; }

  # Missing API paths must not return the SPA shell.
  location /api/ { return 404; }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
